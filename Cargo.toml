[package]
name = "auto-ip"
version = "0.2.0"
edition = "2021"
description = "Send JL510x loop-detection frames that assign TTL-based IP addresses"

[lib]
name = "auto_ip"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pnet = "0.35"
